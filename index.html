<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 450px;
        }

        h1 { font-size: 2.2rem; margin-bottom: 30px; }

        /* Butonları yan yana tutan alan */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* Aradaki boşluk */
            height: 100px;
            position: relative;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #evetBtn { background: white; color: #ff416c; }

        /* Başlangıçta efendi gibi duran Hayır butonu */
        #kacanBtn {
            background: #333;
            color: white;
            z-index: 100;
        }

        #finalMessage { display: none; text-align: center; }
    </style>
</head>
<body>

    <audio id="askSarkisi" loop>
        <source src="sarki.mp3" type="audio/mpeg">
        <source src="./sarki.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainCard">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="btn-wrapper">
            <button id="evetBtn" onclick="baslat()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <div id="finalMessage">
        <h1 style="font-size:4rem;">❤️ SENİ SEVİYORUM ❤️</h1>
        <p style="font-size:1.8rem;">Hazırlan, operasyon başlıyor! ✈️</p>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');
        const sarki = document.getElementById('askSarkisi');

        function kac() {
            // Butonun kaçarken ekranın dışına çıkmaması için sınırlar
            const margin = 100;
            const x = Math.random() * (window.innerWidth - kacanBtn.offsetWidth - margin);
            const y = Math.random() * (window.innerHeight - kacanBtn.offsetHeight - margin);
            
            // İlk kez kaçtığında pozisyonunu serbest bırakıyoruz
            kacanBtn.style.position = 'fixed';
            kacanBtn.style.left = x + 'px';
            kacanBtn.style.top = y + 'px';
        }

        kacanBtn.addEventListener('mouseenter', kac);
        kacanBtn.addEventListener('touchstart', (e) => { e.preventDefault(); kac(); });

        function baslat() {
            sarki.play().catch(e => console.log("Müzik hatası"));
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
            document.body.style.background = "#ff0000";
        }
    </script>
</body>
</html>
