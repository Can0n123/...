<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff1744, #ff8a80);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
            transition: 1s;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 500px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #evetBtn {
            background-color: #ffffff;
            color: #ff1744;
        }

        #kacanBtn {
            background-color: #333;
            color: white;
            position: absolute;
        }

        .final-screen {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Kendi Şarkın Burada -->
    <!-- src kısmına şarkı dosyanın tam adını yaz (uzantısı .mp3 olsun) -->
    <audio id="askSarkisi" loop>
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainCard">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="buttons">
            <button id="evetBtn" onclick="baslat()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <div id="finalMessage" class="final-screen">
        <h1 style="font-size:5rem;">❤️ SENİ SEVİYORUM ❤️</h1>
        <p style="font-size:2rem;">Hazırlan, operasyon başlıyor! ✈️</p>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');
        const sarki = document.getElementById('askSarkisi');

        function butonuKacir() {
            const x = Math.random() * (window.innerWidth - kacanBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - kacanBtn.offsetHeight);
            kacanBtn.style.left = x + 'px';
            kacanBtn.style.top = y + 'px';
        }

        kacanBtn.addEventListener('mouseenter', butonuKacir);
        kacanBtn.addEventListener('touchstart', butonuKacir);

        function baslat() {
            // Şarkıyı çalmaya çalış
            sarki.play().catch(error => {
                console.log("Müzik çalma hatası:", error);
            });
            
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
            document.body.style.background = "#ff4b2b";
        }
    </script>

</body>
</html>
