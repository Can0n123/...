<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            max-width: 90%;
        }

        h1 {
            color: #d81b60;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">👑❤️</div>
        <h1>Sana Aşığım, Seni Kaçıracam Kızım❤️</h1>
        <p>Benimle gelmeye hazır mısın?</p>
        
        <div class="btn-container">
            <button id="yesBtn" class="btn" onclick="celebrate()">EVET!</button>
            <button id="noBtn" class="btn">HAYIR</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Butonun kaçma fonksiyonu
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        });

        // Evet butonuna basınca olacaklar
        function celebrate() {
            alert('Zaten başka şansın yoktu! ❤️ Hazırlan, kaçırılıyorsun!');
            document.body.innerHTML = `
                <div style="color:white; text-align:center;">
                    <h1 style="font-size:4rem;">❤️ OLEY! ❤️</h1>
                    <p style="font-size:2rem;">Seninle her yere gelirim!</p>
                </div>
            `;
            document.body.style.backgroundColor = "#ff4b2b";
        }
    </script>

</body>
</html>
