<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var! ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ff8fa3; /* İstediğin pembe tonu */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 350px;
            min-height: 250px;
            position: relative;
            border: 4px solid #ff4d6d;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.6rem;
            margin-bottom: 60px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #evetBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        #hayirBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="muzik">
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="kutu">
        <h1 id="txt">Ben Senden Hoşlanıyorum, <br>Benimle Çıkar Mısın? ❤️</h1>
        <div class="btn-group">
            <button id="evetBtn" onclick="onayla()">Evet ❤️</button>
            <button id="hayirBtn" onmouseover="kac()" style="left: 190px; top: 165px;">Hayır</button>
        </div>
    </div>

    <script>
        function kac() {
            const btn = document.getElementById('hayirBtn');
            const kutu = document.getElementById('kutu');
            
            // Butonun sadece beyaz kutu içinde kalması için sınırlar
            const maxX = kutu.clientWidth - btn.clientWidth - 20;
            const maxY = kutu.clientHeight - btn.clientHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function onayla() {
            const m = document.getElementById('muzik');
            m.play().catch(e => console.log("Müzik yüklenemedi."));

            // Konfeti patlatma (Profesyonel efekt)
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ff8fa3', '#ffffff']
            });

            document.getElementById('txt').innerHTML = "Bende Seni Çok Seviyorum Yavrummm ❤️❤️❤️";
            document.getElementById('evetBtn').remove();
            document.getElementById('hayirBtn').remove();

            setTimeout(() => {
                alert("Dünyanın en mutlu insanı yaptın beni! ❤️");
            }, 500);
        }
    </script>
</body>
</html>
