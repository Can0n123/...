<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff1744, #ff8a80);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 500px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #evetBtn {
            background-color: #ffffff;
            color: #ff1744;
        }

        #kacanBtn {
            background-color: #333;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="buttons">
            <button id="evetBtn" onclick="tebrikler()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');

        // Butonun kaçma fonksiyonu
        function butonuKacir() {
            // Ekran genişliği ve yüksekliğini al
            const x = Math.random() * (window.innerWidth - kacanBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - kacanBtn.offsetHeight);
            
            kacanBtn.style.left = x + 'px';
            kacanBtn.style.top = y + 'px';
        }

        // Hem mouse hem dokunma için kaçma tetikleyicisi
        kacanBtn.addEventListener('mouseenter', butonuKacir);
        kacanBtn.addEventListener('touchstart', butonuKacir);

        function tebrikler() {
            alert('Zaten başka seçeneğin yoktu! ❤️ Hazırlan, operasyon başlıyor!');
            document.body.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <h1 style="font-size:5rem;">❤️ SENİ SEVİYORUM ❤️</h1>
                    <p style="font-size:2rem;">Artık benimle geliyorsun!</p>
                </div>
            `;
        }
    </script>

</body>
</html>
