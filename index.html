<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 450px;
            position: relative;
        }

        h1 { font-size: 2.2rem; margin-bottom: 30px; }

        /* Butonun hapsolacağı alan */
        .btn-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            height: 200px; /* Butonun kaçacağı alanın yüksekliği */
            position: relative; /* Bu çok önemli, buton bunun içinde hapsolacak */
            border: 1px dashed rgba(255,255,255,0.3); /* Alanı görmen için hafif bir çerçeve */
            border-radius: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }

        #evetBtn { background: white; color: #ff416c; z-index: 1; }

        #kacanBtn {
            background: #333;
            color: white;
            position: absolute; /* Alan içinde serbest hareket */
            z-index: 2;
            left: 60%; /* İlk başta duracağı yer */
        }

        #finalMessage { display: none; text-align: center; }
    </style>
</head>
<body>

    <audio id="askSarkisi" loop>
        <source src="sarki.mp3" type="audio/mpeg">
        <source src="./sarki.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainCard">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="btn-area" id="box">
            <button id="evetBtn" onclick="baslat()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <div id="finalMessage">
        <h1 style="font-size:4rem;">❤️ SENİ SEVİYORUM ❤️</h1>
        <p style="font-size:1.8rem;">Hazırlan, operasyon başlıyor! ✈️</p>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');
        const box = document.getElementById('box');
        const sarki = document.getElementById('askSarkisi');

        function kac() {
            // Butonun hapsolacağı kutunun genişlik ve yüksekliğini al
            const boxWidth = box.offsetWidth;
            const boxHeight = box.offsetHeight;

            // Butonun kendi boyutlarını al
            const btnWidth = kacanBtn.offsetWidth;
            const btnHeight = kacanBtn.offsetHeight;

            // Kutu sınırları içinde rastgele yeni koordinatlar (taşma payı bırakarak)
            const newX = Math.random() * (boxWidth - btnWidth);
            const newY = Math.random() * (boxHeight - btnHeight);

            // Koordinatları uygula
            kacanBtn.style.left = newX + 'px';
            kacanBtn.style.top = newY + 'px';
        }

        kacanBtn.addEventListener('mouseenter', kac);
        kacanBtn.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            kac(); 
        });

        function baslat() {
            sarki.play().catch(e => console.log("Müzik hatası"));
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
            document.body.style.background = "#ff0000";
        }
    </script>
</body>
</html>
