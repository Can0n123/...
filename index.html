<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
            transition: 1s;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 85%;
            max-width: 450px;
            z-index: 10;
        }

        h1 { font-size: 2.2rem; margin-bottom: 30px; }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            height: 150px;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }

        #evetBtn { background: white; color: #ff416c; }

        #kacanBtn {
            background: #333;
            color: white;
            position: absolute;
            transition: 0.1s;
        }

        #finalMessage { display: none; text-align: center; }
    </style>
</head>
<body>

    <!-- Müzik Kutusu -->
    <audio id="askSarkisi" loop>
        <!-- Tarayıcıya iki seçenek sunuyoruz, hangisi tutarsa -->
        <source src="sarki.mp3" type="audio/mpeg">
        <source src="sarki" type="audio/mpeg">
    </audio>

    <div class="container" id="mainCard">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="buttons">
            <button id="evetBtn" onclick="baslat()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <div id="finalMessage">
        <h1 style="font-size:4rem;">❤️ SENİ SEVİYORUM ❤️</h1>
        <p style="font-size:1.8rem;">Hazırlan, operasyon başlıyor! ✈️</p>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');
        const sarki = document.getElementById('askSarkisi');

        // Buton kaçırma
        function kac() {
            const x = Math.random() * (window.innerWidth - kacanBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - kacanBtn.offsetHeight);
            kacanBtn.style.left = x + 'px';
            kacanBtn.style.top = y + 'px';
        }

        kacanBtn.addEventListener('mouseenter', kac);
        kacanBtn.addEventListener('touchstart', (e) => { e.preventDefault(); kac(); });

        function baslat() {
            // Müzik sesini %100 yap ve çal
            sarki.volume = 1.0;
            sarki.play().catch(e => {
                alert("Müzik dosyası (sarki.mp3) bulunamadı! Dosyanın adını kontrol et.");
            });

            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
            document.body.style.background = "#ff0000";
        }
    </script>
</body>
</html>
