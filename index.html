<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz! ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff1744, #ff8a80);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            transition: background 1s;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 85%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: center;
            height: 120px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #evetBtn {
            background-color: #ffffff;
            color: #ff1744;
            box-shadow: 0 5px 15px rgba(255,255,255,0.4);
        }

        #evetBtn:active {
            transform: scale(0.9);
        }

        #kacanBtn {
            background-color: #333;
            color: white;
            position: absolute;
            z-index: 999;
        }

        #finalMessage {
            display: none;
            text-align: center;
            animation: zoomIn 0.8s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Müzik Çalar -->
    <audio id="askSarkisi" preload="auto" loop>
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainCard">
        <h1>Sana Aşığım Seni Kaçıracam Kızım❤️</h1>
        <div class="buttons">
            <button id="evetBtn" onclick="baslat()">EVET</button>
            <button id="kacanBtn">HAYIR</button>
        </div>
    </div>

    <div id="finalMessage">
        <h1 style="font-size:4rem;">❤️ SENİ SEVİYORUM ❤️</h1>
        <p style="font-size:1.8rem;">Hazırlan, operasyon başlıyor! ✈️</p>
    </div>

    <script>
        const kacanBtn = document.getElementById('kacanBtn');
        const sarki = document.getElementById('askSarkisi');
        const mainCard = document.getElementById('mainCard');
        const finalMessage = document.getElementById('finalMessage');

        // Buton Kaçırma Fonksiyonu
        function moveButton() {
            const maxX = window.innerWidth - kacanBtn.offsetWidth - 20;
            const maxY = window.innerHeight - kacanBtn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            kacanBtn.style.left = randomX + 'px';
            kacanBtn.style.top = randomY + 'px';
        }

        // Hem mouse hem dokunmatik ekranlar için
        kacanBtn.addEventListener('mouseenter', moveButton);
        kacanBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Evet butonuna basınca olacaklar
        function baslat() {
            // Şarkıyı çal
            sarki.play().then(() => {
                console.log("Müzik başarıyla başladı.");
            }).catch(e => {
                console.error("Müzik çalma hatası. Dosya ismini kontrol et:", e);
                // Eğer sarki.mp3 bulunamazsa bir uyarı vermesini istersen burayı açabilirsin:
                // alert("Şarkı bulunamadı, dosya ismini kontrol et!");
            });

            // Ekran değiştirme
            mainCard.style.display = 'none';
            finalMessage.style.display = 'block';
            document.body.style.background = "#ff4b2b";
        }
    </script>

</body>
</html>
